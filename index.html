<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA AI — Unified Intelligence Platform</title>
    <meta name="description" content="Multi-model AI chat, live web research, document intelligence, long-term memory, voice AI, image studio, and coding workspace." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nova_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 dark:bg-[#09090B] dark:text-zinc-50 antialiased selection:bg-zinc-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
